services:
  qubic_decentralization_report:
    image: andyqus/qubic_decentralization_report:latest
    container_name: qubic_decentralization_report
    environment:
      # This service is the reader; the ingest service below owns the writing.
      # Without this the image would run both halves in one container, which is
      # the right default for a plain `docker run` but not here.
      - QDR_ROLE=api
      # Public Qubic RPC endpoint the report is built from.
      - QUBIC_RPC_BASE=${QUBIC_RPC_BASE:-https://rpc.qubic.org}
      # RPC response cache (and any derived artefacts) live in the volume.
      - DATA_DIR=/data
      # Optional: mount your own registry over the bundled one, see volumes below.
      # - QDR_REGISTRY=/data/pools.json
      # Persistent store: sealed epochs live here, so history survives restarts.
      # Defaults to $DATA_DIR/qdr.db; set only to move it.
      # - QDR_DB=/data/qdr.db
      # How stale the running epoch may get before a request recomputes it.
      - QDR_LIVE_MAX_AGE=${QDR_LIVE_MAX_AGE:-300}
      # Bob node: the source of the epoch-end computor payouts. Point this at your
      # own node (RPC port 40420) instead of the public one where you can.
      - QDR_BOB_URL=${QDR_BOB_URL:-https://bob.qubic.li/qubic}
    ports:
      - "8000:8000"
    volumes:
      # Bind mount under /root, the same shape qubic_spotlight and
      # qubic_doge_stats use on this host: one predictable directory per
      # service, inspectable and backup-able without docker. The container runs
      # as root so it can write a root-owned host directory — see the Dockerfile.
      - /root/qdr/data:/data
      # Optional: serve a self-maintained pool registry without rebuilding.
      # - /root/qdr/pools.json:/data/pools.json:ro
    restart: unless-stopped

  # The ingest worker is what makes the report keep itself current: it backfills
  # history on first start, refreshes the running epoch, and seals each epoch as
  # it closes. It is a separate service on purpose — if it dies on an RPC outage
  # the dashboard stays up serving the last sealed epochs, and `docker compose
  # logs` shows which of the two is unhappy. Both share one volume; the API only
  # ever reads what this writes.
  qubic_decentralization_report_ingest:
    image: andyqus/qubic_decentralization_report:latest
    container_name: qubic_decentralization_report_ingest
    environment:
      - QDR_ROLE=ingest
      - QUBIC_RPC_BASE=${QUBIC_RPC_BASE:-https://rpc.qubic.org}
      - DATA_DIR=/data
      - QDR_BOB_URL=${QDR_BOB_URL:-https://bob.qubic.li/qubic}
      # How many epochs to seal on first start. Bob keeps end-epoch logs well
      # past this, so a new deployment has real history within minutes.
      - QDR_BACKFILL_EPOCHS=${QDR_BACKFILL_EPOCHS:-10}
      # Days of burn history to count on first start, from BEFORE this worker
      # existed. The live scan can only date ticks it watches go by, so without
      # this the burn series begins at deployment and the page shows one partial
      # day. Defaults to 4 (one epoch) because the deployment this image serves
      # is installed by a watcher that sets no environment — an opt-in flag there
      # could never be switched on. Set 0 to turn it off.
      # It runs once: a completed window is recorded and a restart skips it, and
      # a run that stopped short is resumed rather than declared finished.
      # Costs ~270 calls per day; the budget scales with the days asked for.
      - QDR_BURN_BACKFILL_DAYS=${QDR_BURN_BACKFILL_DAYS:-4}
      # How often the worker re-asks "is the last complete day in the report?".
      # Midnight turns the running day into a finished one that only the live
      # scan's slice covers, and no recorded tick window can notice that. An
      # idle check reads the local store and makes no network call at all.
      - QDR_BURN_BACKFILL_INTERVAL=${QDR_BURN_BACKFILL_INTERVAL:-3600}
      # How often the running epoch is refreshed. The analysis only changes at an
      # epoch boundary (~4.4 days), but balance snapshots must be taken while the
      # boundary is passing, so this stays well under it.
      - QDR_INGEST_INTERVAL=${QDR_INGEST_INTERVAL:-300}
      # How often live mining state is sampled into the store. Much faster than
      # the ingest interval above, because this is a live reading that cannot be
      # recovered later — the report only changes at an epoch boundary, the
      # colony changes every tick. Only the last two epochs of samples are kept
      # (~2 MB); the per-epoch summary is permanent.
      - QDR_MINING_SAMPLE_INTERVAL=${QDR_MINING_SAMPLE_INTERVAL:-30}
    volumes:
      - /root/qdr/data:/data
    depends_on:
      - qubic_decentralization_report
    restart: unless-stopped
